    <!-- CRITICAL: Theme flash prevention — must run synchronously before any paint -->
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('scar_theme');
          var theme;
          if (stored === 'light' || stored === 'dark') {
            theme = stored;
          } else {
            // System preference or no preference stored
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', theme);
          // Update theme-color meta for browser chrome
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) {
            meta.setAttribute('content', theme === 'dark' ? '#070b14' : '#F8FAFC');
          }
        } catch(e) {
          // Fallback to dark if localStorage is unavailable
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
